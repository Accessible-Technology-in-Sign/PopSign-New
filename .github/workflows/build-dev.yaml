    create-release:
        runs-on: [self-hosted, macOS]
        needs: [build-mobile]
        steps:
            - name: Download iOS build
              uses: actions/download-artifact@v4
              with:
                name: popsign-ipa
                path: PopSignAI.ipa

            - name: Download Android Build
              uses: actions/download-artifact@v5
              with:
                name: build-folder-after-Android
                path: android-build

            - name: Create Release
              uses: softprops/action-gh-release@v2
              with:
                  files: |
                      PopSignAI.ipa/PopSignAI.ipa
                      ${{ github.workspace }}/android-build/Android/Android.apk/PopSignAI.arm64-v8a.apk
                      ${{ github.workspace }}/android-build/Android/Android.apk/PopSignAI.armeabi-v7a.apk
                  tag_name: Mobile-Releases-${{ github.run_number }}-${{ github.triggering_actor }}
                  token: ${{ secrets.GITHUB_TOKEN }}
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
